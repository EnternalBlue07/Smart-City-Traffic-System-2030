<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ error_code }} - {{ error_title }}</title>
    <link rel="stylesheet" href="/static/css/theme.css">
</head>
<body>
    <div class="login-container">
        <div class="card login-card" style="text-align: center;">
            <div style="font-size: 5rem; color: var(--color-accent); margin-bottom: 1rem;">
                {{ error_code }}
            </div>
            <h1 style="color: var(--color-accent); margin-bottom: 1rem;">
                {{ error_title }}
            </h1>
            <p style="color: var(--color-light); font-size: 1.125rem; margin-bottom: 2rem;">
                {{ error_message }}
            </p>
            <div style="display: flex; gap: 1rem; justify-content: center;">
                <a href="javascript:history.back()" class="btn btn-secondary">Go Back</a>
                <a href="/" class="btn btn-primary">Home</a>
            </div>
        </div>
    </div>
</body>
</html>
